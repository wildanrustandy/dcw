name: release

# Build the Linux prebuilt binary and publish it as a GitHub release asset.
#
# macOS runners are NOT available on free GitHub accounts, so macOS binaries are
# built on a Mac and uploaded manually (see README "Rilis (prebuilt binary)"):
#   cargo build --release && cp target/release/dcw dcw-macos-aarch64
#   gh release upload <tag> dcw-macos-aarch64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release
      - name: Copy asset (dcw -> dcw-linux-x86_64)
        run: cp target/release/dcw dcw-linux-x86_64
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dcw-linux-x86_64