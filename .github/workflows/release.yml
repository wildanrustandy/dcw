name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: dcw-linux-x86_64
          - os: macos-14
            asset: dcw-macos-aarch64
          - os: macos-13
            asset: dcw-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release
      - name: Copy asset (dcw -> ${{ matrix.asset }})
        run: cp target/release/dcw "${{ matrix.asset }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show assets
        run: ls -la dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dcw-linux-x86_64
            dist/dcw-macos-aarch64
            dist/dcw-macos-x86_64