[package]
name = "dcw"
version = "0.1.1"
edition = "2021"
description = "dcw — worktree + port + Django server + Celery lifecycle"
license = "MIT"

[[bin]]
name = "dcw"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["signal", "process", "term", "user", "fs"] }
crossterm = "0.27"

[profile.release]
lto = true